<script>
window.NBV = {};
NBV.render = function(theme, poik, showPois){
  var ap=document.getElementById("app"); if(ap){ap.innerHTML="";ap.style.display="none";}
  var st=document.getElementById("stars"); if(st){st.style.display="none";}
  document.body.style.background="#111";

  const e = THEMES[theme].content.explore;
  const deco = (typeof e.deco === "function") ? e.deco(e) : (e.deco || "");
  const h = document.getElementById("holder");
  h.style.width = e.width + "px"; h.style.height = e.height + "px";
  const bg = e.bgCss || "linear-gradient(180deg,#0b0530,#1b1250)";
  h.innerHTML = '<div class="mapcanvas" id="mapcanvas" style="position:absolute;left:0;top:0;width:'+e.width+'px;height:'+e.height+'px;background:'+bg+'">'
    + '<div class="mapdeco">'+deco+'</div>'
    + (showPois === false ? "" : e.pois.map(function(p,i){
        return '<button class="poi" data-i="'+i+'" style="left:'+p.x+'px;top:'+p.y+'px">'
          + (p.svg ? '<span class="picon" style="width:'+p.iw+'px;height:'+p.ih+'px">'+p.svg+'</span>'
                   : '<span class="pemoji" style="font-size:'+((p.size||1)*2.2)+'rem">'+p.emoji+'</span>')
          + '<span class="plabel">'+ (p.name.es) +'</span></button>';
      }).join(""))
    + '</div>';
  document.getElementById("mapcanvas").style.setProperty("--poik", poik || 1);
  document.body.style.width = e.width + "px";
  return {w:e.width,h:e.height};
};
NBV.ready = true;
</script>
